/* Kartovník 2 · grafika obchodů, fotografie a skener */

var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}

function quickTile(c){
 const theme=visualFor(c),m=merchantOf(c),tile=(!c.picture&&!c.autoLogo&&m)?CARD_TILE_ASSETS[m.id]:null;
 const content=tile?`<img class="quick-tile-asset" src="${tile}" alt="">`:`<span class="quick-logo">${cardPicture(c)}</span>`;
 return `<button class="quick-card ${tile?'quick-photo-card':c.autoLogo?'auto-logo-tile':''}" style="background:${esc(theme.bg)};border-color:${esc(theme.edge)}" data-action="detail" data-id="${esc(c.id)}" aria-label="Zobrazit kartu ${esc(c.name)}">${content}<span class="sr-only">${esc(c.name)}</span></button>`;
}
function renderHome(){
 const el=$('#quick-content');if(!el)return;
 if(!cards.length){el.innerHTML=`<div class="empty quick-empty"><div class="emptyicon">${icon('cards')}</div><h3>Zatím žádné karty</h3><p>Novou kartu přidáš v záložce Správa karet.</p><button class="primary" data-action="view-manage" style="margin:auto">${icon('plus')} Správa karet</button></div>`;return}
 const q=normalizeName(state.homeQuery);
 const list=quickCards().filter(c=>!q||normalizeName(c.name+' '+(merchantOf(c)?.short||'')).includes(q));
 if(!list.length){el.innerHTML='<div class="search-empty">Žádné karty neodpovídají hledání.</div>';return}
 const renderGrid=arr=>`<div class="quick-grid">${arr.map(quickTile).join('')}</div>`;
 if(q){el.innerHTML=renderGrid(list);return}
 const other=list.filter(c=>!c.favorite), fav=list.filter(c=>c.favorite);
 el.innerHTML=other.length?renderGrid(other):'';
 if(fav.length){
  if(other.length)el.innerHTML+='<div class="frequent-head"><span>Často používané</span></div>';
  el.innerHTML+=renderGrid(fav);
 }
}
function renderManageList(){
 const el=$('#manage-list');if(!el)return;
 const q=state.query.trim().toLocaleLowerCase('cs');
 const list=quickCards().filter(c=>!q||(c.name+' '+c.number).toLocaleLowerCase('cs').includes(q));
 if(!list.length){el.innerHTML=`<div class="manage-empty">${cards.length?'Žádná karta neodpovídá hledání.':'Zatím nemáš žádné uložené karty. Přidej první tlačítkem nahoře.'}</div>`;return}
 el.innerHTML=list.map(c=>`<div class="manage-card"><div class="manage-logo" style="background:${esc(visualFor(c).bg)}">${cardPicture(c)}</div><div class="manage-info"><div class="manage-name">${esc(c.name)}</div><div class="manage-code">${esc(shortNumber(c.number))}</div></div><div class="manage-actions"><button class="manage-action ${c.favorite?'is-fav':''}" data-action="favorite" data-id="${esc(c.id)}" title="${c.favorite?'Odebrat z rychlých':'Přesunout nahoru'}" aria-label="${c.favorite?'Odebrat z předních pozic':'Zobrazit mezi prvními'}: ${esc(c.name)}" aria-pressed="${c.favorite}">${icon('star')}</button><button class="manage-action" data-action="edit" data-id="${esc(c.id)}" title="Upravit" aria-label="Upravit kartu ${esc(c.name)}">${icon('edit')}</button><button class="manage-action danger-action" data-action="delete" data-id="${esc(c.id)}" title="Smazat" aria-label="Smazat kartu ${esc(c.name)}">${icon('trash')}</button></div></div>`).join('');
}
function renderNav(){
 const options=[['cards','cards','Karty'],['manage','settings','Správa karet']];
 $('#navigation').innerHTML=`<div class="bottom-inner">${options.map(([id,ic,t])=>`<button class="nav ${id===state.view?'selected':''}" data-action="view-${id}" aria-current="${id===state.view?'page':'false'}" aria-label="${t}">${icon(ic)}<span>${t}</span></button>`).join('')}</div>`;
}
function createForm(id=null){state.editingId=id;const c=id?cardById(id):null;const base=c||{name:'',number:'',group:'potraviny',format:'auto',color:COLOR_SET[0],brand:'',picture:''};state.formPicture=base.picture||'';state.formAutoLogo=base.autoLogo||'';state.formLogoDomain=base.logoDomain||'';state.logoRequest++;state.logoChoices=[];
const selected=base.brand||guessMerchant(base.name)?.id||'';
const choices=['tesco','lidl','kaufland','albert','billa','penny','dm','rossmann','ikea','globus','shell','decathlon','benu','obi','dracik','zverokruh','cinestar','electroworld'];

function setLogoStatus(msg){const el=$('#logoStatus');if(el)el.textContent=msg}
function scheduleLogoLookup(){
 if(state.logoTimer)clearTimeout(state.logoTimer);
 const req=++state.logoRequest;state.logoBusy=false;
 if(!$('#cardForm'))return;
 const name=$('#cardname').value.trim();
 $('#logoChoices')?.classList.add('hidden');
 if(name.length<2){setLogoStatus('Napiš název obchodu.');return}
 setLogoStatus('Automaticky vyhledám logo podle názvu…');
 state.logoTimer=setTimeout(()=>{if(req===state.logoRequest)findLogo(false)},700);
}
function cleanDomain(domain){return /^[a-z0-9](?:[a-z0-9.-]{1,118})\.[a-z]{2,20}$/i.test(domain||'')?domain.toLowerCase():''}
function bestLogoMatch(results,term){
 const n=normalizeName(term),variants=new Set([n]);const b=guessMerchant(term);
 if(b){variants.add(normalizeName(b.short));variants.add(normalizeName(b.name))}
 return results.filter(x=>cleanDomain(x.domain)).map(x=>{
 const name=normalizeName(x.name||'');const domain=normalizeName((x.domain||'').split('.')[0]);
 const exact=variants.has(name)||variants.has(domain);
 const token=variants.size>1&&([...variants].some(v=>v.startsWith(name+' ')||name.startsWith(v+' ')));
 return {...x,match:exact?3:token?2:0};
 }).sort((a,b)=>b.match-a.match||Number(b.score||0)-Number(a.score||0));
}
async function readLogoPng(domain){
 const host=cleanDomain(domain);if(!host)throw Error('domain');
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),9500);
 try{
  const response=await fetch('https://logoapi.sh/'+encodeURIComponent(host)+'?fallback=404',{signal:controller.signal,mode:'cors',credentials:'omit'});
  if(!response.ok||!/^image\//.test(response.headers.get('content-type')||''))throw Error('not_found');
  const blob=await response.blob();if(blob.size>1500000)throw Error('too_large');
  const objectUrl=URL.createObjectURL(blob);
  try{
   const img=new Image();img.src=objectUrl;await img.decode();
   const canvas=document.createElement('canvas');canvas.width=500;canvas.height=250;
   const ctx=canvas.getContext('2d');const w=img.naturalWidth,h=img.naturalHeight;
   if(!w||!h)throw Error('empty');
   const f=Math.min(455/w,205/h);const outW=w*f,outH=h*f;
   ctx.drawImage(img,(500-outW)/2,(250-outH)/2,outW,outH);
   let data=canvas.toDataURL('image/png');
   if(data.length>290000){const temp=document.createElement('canvas');temp.width=360;temp.height=180;temp.getContext('2d').drawImage(canvas,0,0,360,180);data=temp.toDataURL('image/png')}
   if(data.length>=300000)throw Error('large');return data;
  }finally{URL.revokeObjectURL(objectUrl)}
 }finally{clearTimeout(timer)}
}
async function lookupRemoteName(name){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8500);
 try{
  const r=await fetch('https://logoapi.sh/search?q='+encodeURIComponent(name.slice(0,80)),{signal:controller.signal,credentials:'omit'});
  if(!r.ok)throw Error('search');const j=await r.json();return Array.isArray(j.results)?j.results:[];
 }finally{clearTimeout(timer)}
}
function showLogoChoices(results){
 const el=$('#logoChoices');if(!el)return;
 const list=results.filter(x=>cleanDomain(x.domain)).slice(0,4);
 el.innerHTML=list.map(x=>`<button type="button" class="logo-choice ${x.domain===state.formLogoDomain?'logo-choose-selected':''}" data-action="choose-logo" data-domain="${esc(x.domain)}" title="${esc(x.domain)}"><img src="${esc('https://logoapi.sh/'+x.domain+'.svg?fallback=404')}" alt=""><span>${esc(x.name||x.domain)}</span></button>`).join('');
 el.classList.toggle('hidden',!list.length);
}
async function findLogo(manual=false){
 const inp=$('#cardname');if(!inp)return;const name=inp.value.trim();if(name.length<2){setLogoStatus('Zadej nejdřív název obchodu.');return}
 if(state.logoTimer)clearTimeout(state.logoTimer);
 const request=++state.logoRequest;state.logoBusy=true;setLogoStatus('Hledám logo na internetu…');
 const known=guessMerchant(name)||getMerchant($('#cardbrand')?.value);
 let results=[];let domain='';
 try{
  results=bestLogoMatch(await lookupRemoteName(known?.short||name),name);
  if(request!==state.logoRequest||!$('#cardForm'))return;
  showLogoChoices(results);
  const top=results[0];
  if(top&&top.match>=2&&(!results[1]||top.match>results[1].match))domain=top.domain;
  if(!domain&&known&&SHOP_DOMAINS[known.id])domain=SHOP_DOMAINS[known.id];
  if(!domain&&top&&top.match>=3)domain=top.domain;
  if(domain){
   const image=await readLogoPng(domain);
   if(request!==state.logoRequest||!$('#cardForm'))return;
   state.formAutoLogo=image;state.formLogoDomain=domain;
   setLogoStatus('Logo nalezeno a připraveno k uložení offline ('+domain+').');renderPreview();
   return;
  }
  setLogoStatus(results.length?'Našel jsem podobné názvy. Vyber správné logo z nabídky.':'Logo se nepodařilo dohledat. Můžeš nahrát vlastní obrázek.');
 }catch(e){
  if(request!==state.logoRequest||!$('#cardForm'))return;
  // Některé známé české obchody nejsou v katalogu. Zkusíme přímo jejich doménu.
  if(known&&SHOP_DOMAINS[known.id]){
   try{const d=SHOP_DOMAINS[known.id],pic=await readLogoPng(d);if(request!==state.logoRequest||!$('#cardForm'))return;state.formAutoLogo=pic;state.formLogoDomain=d;setLogoStatus('Logo nalezeno a uloženo pro offline použití.');renderPreview();return}catch{}
  }
  setLogoStatus('Logo nelze načíst. Zkontroluj internet, nebo nahraj vlastní obrázek.');
 }finally{if(request===state.logoRequest)state.logoBusy=false}
}
async function chooseAutoLogo(domain){
 if(!cleanDomain(domain))return;
 if(state.logoTimer)clearTimeout(state.logoTimer);
 const request=++state.logoRequest;state.logoBusy=true;setLogoStatus('Načítám vybrané logo…');
 try{const data=await readLogoPng(domain);if(request!==state.logoRequest||!$('#cardForm'))return;state.formAutoLogo=data;state.formLogoDomain=domain;renderPreview();setLogoStatus('Vybrané logo je připravené k uložení offline.')}catch(e){if(request===state.logoRequest)setLogoStatus('Toto logo se nepodařilo načíst. Vyber jiné nebo nahraj vlastní obrázek.')}finally{if(request===state.logoRequest)state.logoBusy=false}
}
// Dříve uložené karty si mohou logo dohledat také, bez ztráty čísel nebo oblíbených.
async function refreshExistingLogos(){
 if(!navigator.onLine)return;
 const doneKey='kartovnik_logo_checked_v1';let checked={};
 try{checked=JSON.parse(localStorage.getItem(doneKey)||'{}')||{}}catch{}
 for(const c of cards.slice(0,24)){
  if(c.autoLogo||c.picture)continue;
  if(checked[c.id]&&Date.now()-checked[c.id]<3*86400000)continue;
  checked[c.id]=Date.now();
  const merchant=merchantOf(c);if(!merchant)continue;
  try{
   const hits=bestLogoMatch(await lookupRemoteName(merchant.short),c.name);
   const domain=(hits[0]?.match>=2?hits[0].domain:null)||SHOP_DOMAINS[merchant.id];
   if(domain){const pic=await readLogoPng(domain);const live=cardById(c.id);if(live&&!live.autoLogo&&!live.picture&&live.name===c.name){live.autoLogo=pic;live.logoDomain=domain;store();if(!state.detailId){renderHome();renderManageList()}}}
  }catch{}
 }
 try{localStorage.setItem(doneKey,JSON.stringify(checked))}catch{}
}

function chooseMerchant(id){const b=getMerchant(id);state.formAutoLogo='';state.formLogoDomain='';state.logoChoices=[];const candidateNode=$('#logoChoices');if(candidateNode){candidateNode.innerHTML='';candidateNode.classList.add('hidden')}$('#cardbrand').value=b?.id||'';if(b){$('#cardname').value=b.name;$('#cardgroup').value=b.group;$('#cardcolor').value=COLOR_SET.reduce((a,c)=>{function dist(v,w){const z=v.match(/[a-f0-9]{2}/ig)||[],y=w.match(/[a-f0-9]{2}/ig)||[];return z.reduce((s,x,i)=>s+Math.abs(parseInt(x,16)-parseInt(y[i],16)),0)}return dist(c,b.color)<dist(a,b.color)?c:a},COLOR_SET[0]);}$('#palette').querySelectorAll('.dot').forEach(x=>{const on=x.dataset.color===$('#cardcolor').value;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',String(on))});$('#merchantQuick').querySelectorAll('[data-action="merchant"]').forEach(x=>x.classList.toggle('active',x.dataset.id===id));renderPreview();scheduleLogoLookup()}
async function handlePhoto(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>12*1024*1024){toast('Obrázek je příliš velký (max. 12 MB).');return}try{const raw=await readFileAsDataURL(file);const img=new Image();img.src=raw;await img.decode();const max=370,scale=Math.min(1,max/Math.max(img.naturalHeight,img.naturalWidth));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let output=canvas.toDataURL('image/jpeg',.72);if(output.length>290000)output=canvas.toDataURL('image/jpeg',.45);if(output.length>=300000)throw Error('large');state.formPicture=output;renderPreview();toast('Obrázek byl přidán. Ulož kartu.')}catch(e){toast('Obrázek se nepodařilo otevřít. Zkus JPG nebo PNG.')}}

function saveForm(){if(state.logoBusy){toast('Logo se ještě načítá. Zkus uložit kartu znovu.');return}const name=$('#cardname')?.value.trim();const number=$('#cardnumber')?.value.trim();const color=$('#cardcolor')?.value;const group=$('#cardgroup')?.value;const format=$('#cardformat')?.value;if(!name||!number)return toast('Vyplň název a číslo karty.');if(number.length>400)return toast('Kód je příliš dlouhý.');if((format==='ean13'&&!eanValid(number,13))||(format==='ean8'&&!eanValid(number,8))||(format==='upca'&&!eanValid('0'+number,13))){toast('EAN musí mít správný počet číslic a kontrolní číslici.');return}if(format==='code39'&&!code39Valid(number)){toast('Code 39 podporuje velká písmena, čísla a znaky -. $/+%.');return}if(format==='code128'&&!asciiValid(number)){toast('Code 128 podporuje pouze běžné znaky. Použij QR kód.');return}

function actualFormat(c){if(c.format!=='auto')return c.format;if(eanValid(c.number,13))return'ean13';if(eanValid(c.number,8))return'ean8';if(eanValid('0'+c.number,13)&&c.number.length===12)return'upca';return asciiValid(c.number)?'code128':'qr'}
function asciiValid(s){return [...s].every(x=>x.charCodeAt(0)>=32&&x.charCodeAt(0)<=126)}
function eanValid(s,n){if(!new RegExp('^\\d{'+n+'}$').test(s))return false;let sum=0;for(let i=0;i<n-1;i++)sum+=Number(s[i])*(i%2===n%2?3:1);return(10-sum%10)%10===Number(s[n-1])}
function drawCode(c,format){const canvas=$('#codecanvas');if(!canvas)return;if(format==='qr')return drawQR(canvas,c.number);if(format==='ean13'||format==='ean8')return drawEAN(canvas,c.number,format);if(format==='upca')return drawEAN(canvas,'0'+c.number,'ean13');if(format==='code39')return drawCode39(canvas,c.number);return drawCode128(canvas,c.number)}
function canvasSize(canvas,relativeHeight){const dpr=Math.min(3,window.devicePixelRatio||1),w=Math.max(180,canvas.getBoundingClientRect().width||320);canvas.width=Math.round(w*dpr);canvas.height=Math.round(relativeHeight*dpr);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);return {ctx,w:canvas.width,h:canvas.height,dpr}}
function drawQR(canvas,value){try{const qr=new QR_LIBRARY.QRCode(-1,QR_LIBRARY.M);qr.addData(value);qr.make();const n=qr.getModuleCount(),{ctx,w,h}=canvasSize(canvas,270);const q=4;const size=Math.floor(Math.min(w,h)/(n+q*2));const offsetX=Math.floor((w-size*n)/2),offsetY=Math.floor((h-size*n)/2);ctx.fillStyle='#101926';for(let r=0;r<n;r++)for(let col=0;col<n;col++)if(qr.isDark(r,col))ctx.fillRect(offsetX+col*size,offsetY+r*size,size,size)}catch(e){toast('Tento obsah QR kódu nelze vykreslit.');console.error(e)}}
function drawBits(canvas,bits){const{ctx,w,h}=canvasSize(canvas,150);const margin=Math.max(15,Math.floor(w*.04));const width=w-2*margin,step=width/bits.length;const y=Math.floor(h*.04),height=Math.floor(h*.87);ctx.fillStyle='#101820';for(let i=0;i<bits.length;i++)if(bits[i]==='1'){let x1=Math.round(margin+i*step),x2=Math.round(margin+(i+1)*step);ctx.fillRect(x1,y,Math.max(1,x2-x1),height)}}
function drawCode128(canvas,value){if(!asciiValid(value)){drawQR(canvas,value);return}const codes=[104];for(const char of value)codes.push(char.charCodeAt(0)-32);let sum=104;for(let i=1;i<codes.length;i++)sum+=i*codes[i];codes.push(sum%103,106);let bits='';for(const code of codes)for(const letter of CODE128_PATTERNS[code]){let n=letter.toUpperCase().charCodeAt(0)-64;bits+=(letter===letter.toUpperCase()?'1':'0').repeat(n)}drawBits(canvas,'000000000000'+bits+'000000000000')}

const CODE39_PATTERNS={"0":"bsbSBsBsb","1":"BsbSbsbsB","2":"bsBSbsbsB","3":"BsBSbsbsb","4":"bsbSBsbsB","5":"BsbSBsbsb","6":"bsBSBsbsb","7":"bsbSbsBsB","8":"BsbSbsBsb","9":"bsBSbsBsb","A":"BsbsbSbsB","B":"bsBsbSbsB","C":"BsBsbSbsb","D":"bsbsBSbsB","E":"BsbsBSbsb","F":"bsBsBSbsb","G":"bsbsbSBsB","H":"BsbsbSBsb","I":"bsBsbSBsb","J":"bsbsBSBsb","K":"BsbsbsbSB","L":"bsBsbsbSB","M":"BsBsbsbSb","N":"bsbsBsbSB","O":"BsbsBsbSb","P":"bsBsBsbSb","Q":"bsbsbsBSB","R":"BsbsbsBSb","S":"bsBsbsBSb","T":"bsbsBsBSb","U":"BSbsbsbsB","V":"bSBsbsbsB","W":"BSBsbsbsb","X":"bSbsBsbsB","Y":"BSbsBsbsb","Z":"bSBsBsbsb","-":"bSbsbsBsB",".":"BSbsbsBsb"," ":"bSBsbsBsb","*":"bSbsBsBsb","$":"bSbSbSbsb","/":"bSbSbsbSb","+":"bSbsbSbSb","%":"bsbSbSbSb"};
function code39Valid(value){return /^[0-9A-Z .\-$/+%]+$/.test(value)}
function drawCode39(canvas,value){if(!code39Valid(value)){toast('Nepodporované znaky Code 39.');return}const items='*'+value+'*';let bits='0'.repeat(12);for(let i=0;i<items.length;i++){if(i)bits+='0';for(const el of CODE39_PATTERNS[items[i]])bits+=(el==='b'||el==='B'?'1':'0').repeat(el===el.toUpperCase()?3:1)}drawBits(canvas,bits+'0'.repeat(12))}

const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const EAN_PARITY=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function drawEAN(canvas,value,format){const n=format==='ean13'?13:8;if(!eanValid(value,n)){toast('Neplatný EAN – uprav typ kódu.');return}let bits='101';if(n===13){for(let i=1;i<=6;i++)bits+=(EAN_PARITY[+value[0]][i-1]==='L'?EAN_L:EAN_G)[+value[i]];bits+='01010';for(let i=7;i<13;i++)bits+=EAN_R[+value[i]]}else{for(let i=0;i<4;i++)bits+=EAN_L[+value[i]];bits+='01010';for(let i=4;i<8;i++)bits+=EAN_R[+value[i]]}drawBits(canvas,'00000000000'+bits+'10100000000000')}

async function importCards(event){const file=event.target.files?.[0];event.target.value='';if(!file)return;if(file.size>30*1024*1024)return toast('Soubor je příliš velký (max. 30 MB).');try{const raw=safeParse(await file.text()),arr=Array.isArray(raw)?raw:Array.isArray(raw?.cards)?raw.cards:null;if(!arr)throw Error('invalid');if(arr.length>10000)throw Error('large');const incoming=arr.map(cleanCard).filter(Boolean);if(!incoming.length)throw Error('empty');let count=0;const keys=new Set(cards.map(c=>c.name.toLocaleLowerCase('cs')+'\0'+c.number));for(const c of incoming){const k=c.name.toLocaleLowerCase('cs')+'\0'+c.number;if(!keys.has(k)){c.id=createId();cards.push(c);keys.add(k);count++}}if(!store())return;state.view='manage';state.query='';render();toast(count?`Importováno ${count} karet.`:'Všechny karty už jsou uložené.')}catch(e){toast('Neplatný záložní soubor Kartovníku.')}}

function toggleFav(id){const c=cardById(id);if(!c)return;const previous=c.favorite;c.favorite=!c.favorite;c.updated=Date.now();if(!store()){c.favorite=previous;return}render();}
async function copyNumber(){const c=cardById(state.detailId);if(!c)return;try{await navigator.clipboard.writeText(c.number);toast('Číslo zkopírováno.')}catch{toast('Kopírování není v tomto prohlížeči dostupné.')}}
function toggleCode(){const c=cardById(state.detailId);if(!c)return;const current=state.detailFormat||actualFormat(c);if(current==='qr'){state.detailFormat=eanValid(c.number,13)?'ean13':eanValid(c.number,8)?'ean8':c.number.length===12&&eanValid('0'+c.number,13)?'upca':asciiValid(c.number)?'code128':'qr';if(state.detailFormat==='qr')return toast('Tento kód nelze převést na čárový.')}else state.detailFormat='qr';renderDetail()}
// ZXing-based html5-qrcode (Apache-2.0) is loaded on demand from a pinned CDN;
// unlike native BarcodeDetector it supports scanning on iOS Safari and photos.
let scannerLibraryPromise=null;
function loadScannerLib(){if(window.Html5Qrcode)return Promise.resolve();if(!scannerLibraryPromise){scannerLibraryPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';script.onload=()=>window.Html5Qrcode?resolve():reject(Error('library missing'));script.onerror=()=>reject(Error('network'));document.head.appendChild(script)}).catch(e=>{scannerLibraryPromise=null;throw e})}return scannerLibraryPromise}
function decodedFormat(decodedResult){const raw=decodedResult?.result?.format?.formatName||decodedResult?.result?.format||decodedResult?.format?.formatName||'';const fmt=String(raw).toUpperCase();return {'QR_CODE':'qr','EAN_13':'ean13','EAN_8':'ean8','UPC_A':'upca','CODE_39':'code39','CODE_128':'code128'}[fmt]||'auto'}
function acceptDecoded(value,format){if(!$('#cardForm')||!value)return;const number=$('#cardnumber');number.value=value;$('#cardformat').value=format||'auto';renderPreview();stopScan();try{navigator.vibrate?.(60)}catch{}toast('Kód načten. Zkontroluj číslo a ulož kartu.')}
function showScanner(){const layer=document.createElement('div');layer.id='scanner-root';layer.className='scanner-layer';layer.innerHTML=`<h2 class="scanner-label">Načíst kartu</h2><div id="scanner-reader"></div><p class="scanner-info" id="scanner-info">Povol fotoaparát a namiř jej na čárový nebo QR kód.</p><div class="scanner-actions"><button class="secondary" data-action="scan-photo">${icon('upload')} Vybrat fotku</button><button class="secondary" data-action="stop-scan">${icon('close')} Zavřít</button></div>`;document.body.appendChild(layer)}
async function startScan(){if(!$('#cardForm')||state.scanActive)return;if(!window.isSecureContext){toast('Kamera funguje pouze na HTTPS (GitHub Pages).');return}state.scanActive=true;const token=++state.scanToken;showScanner();try{await loadScannerLib();if(!state.scanActive||token!==state.scanToken)return;const formats=window.Html5QrcodeSupportedFormats;const reader=new Html5Qrcode('scanner-reader',{formatsToSupport:[formats.QR_CODE,formats.CODE_128,formats.EAN_13,formats.EAN_8,formats.UPC_A,formats.CODE_39],verbose:false});state.scannerReader=reader;await reader.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const side=Math.min(w,h);return {width:Math.max(170,Math.floor(side*.8)),height:Math.max(130,Math.floor(side*.55))}}},(v,r)=>acceptDecoded(v,decodedFormat(r)),()=>{});if(!state.scanActive||token!==state.scanToken)await stopScan()}catch(e){console.warn('Scanner error',e);if(!state.scanActive||token!==state.scanToken)return;const info=$('#scanner-info');if(info)info.textContent='Fotoaparát se nepodařilo spustit. Použij obrázek kódu nebo ruční zadání.';toast('Kamera není dostupná. Zkus fotku nebo ruční zadání.');}}
async function scanFromPhoto(event){const file=event.target.files?.[0];event.target.value='';if(!file)return;stopScan();try{toast('Načítám kód z fotografie…');await loadScannerLib();const holder=document.createElement('div');holder.id='temp-reader';holder.className='hidden';document.body.appendChild(holder);let reader;try{reader=new Html5Qrcode('temp-reader',{verbose:false});const value=await reader.scanFile(file,true);acceptDecoded(value,'auto')}finally{try{await reader?.clear()}catch{}holder.remove()}}catch(e){toast('Kód z fotky nebyl načten. Zkus internet, lepší světlo nebo ruční zadání.')}}
function stopScan(){state.scanActive=false;state.scanToken++;if(state.scannerTimer)clearTimeout(state.scannerTimer);state.scannerTimer=null;if(state.scannerStream){state.scannerStream.getTracks().forEach(t=>t.stop());state.scannerStream=null}const reader=state.scannerReader;state.scannerReader=null;if(reader){Promise.resolve(reader.stop()).catch(()=>{}).finally(()=>{try{reader.clear()}catch{}})}$('#scanner-root')?.remove()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;switch(action){case 'view-cards':setView('cards');break;case 'view-manage':setView('manage');break;case 'open-add':createForm();break;case 'detail':openDetail(id);break;case 'close-detail':closeDetail();break;case 'close-form':hideOverlay();break;case 'edit':hideOverlay();createForm(id);break;case 'delete':deleteCard(id);break;case 'favorite':toggleFav(id);break;case 'color':$('#cardcolor').value=el.dataset.color;$('#palette').querySelectorAll('.dot').forEach(x=>{x.classList.toggle('selected',x===el);x.setAttribute('aria-pressed',String(x===el))});renderPreview();break;case 'toggle-code':toggleCode();break;case 'copy':copyNumber();break;case 'export':exportCards();break;case 'import':$('#importFile').click();break;case 'scan':startScan();break;case 'scan-photo':$('#scanPhoto').click();break;case 'photo':$('#brandPhoto').click();break;case 'clear-photo':state.formPicture='';renderPreview();break;case 'merchant':chooseMerchant(id);break;case 'find-logo':findLogo(true);break;case 'choose-logo':chooseAutoLogo(el.dataset.domain);break;case 'clear-auto-logo':state.formAutoLogo='';state.formLogoDomain='';setLogoStatus('Automatické logo odebráno.');renderPreview();break;case 'stop-scan':stopScan();break;}});
document.addEventListener('submit',e=>{if(e.target.id==='cardForm'){e.preventDefault();saveForm()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;renderManageList()}if(e.target.id==='searchCards'){state.homeQuery=e.target.value;renderHome()}if(e.target.id==='cardname'){state.formAutoLogo='';state.formLogoDomain='';scheduleLogoLookup()}if(['cardname','cardnumber'].includes(e.target.id))renderPreview()});
document.addEventListener('change',e=>{if(e.target.id==='importFile')importCards(e);if(e.target.id==='brandPhoto')handlePhoto(e);if(e.target.id==='scanPhoto')scanFromPhoto(e);if(e.target.id==='cardbrand')chooseMerchant(e.target.value)});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.scanActive)stopScan();else if(state.detailId)closeDetail();else if($('#formlayer'))hideOverlay()}});
window.addEventListener('pagehide',stopScan);
window.addEventListener('resize',()=>{if(state.detailId){const c=cardById(state.detailId);if(c)drawCode(c,state.detailFormat||actualFormat(c))}});
render();
setTimeout(()=>{refreshExistingLogos().catch(()=>{})},1800);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(e=>console.debug('PWA offline režim není dostupný',e));

</script>
</body></html>
